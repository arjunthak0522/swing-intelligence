name: RE-ENTRY Full Regression Diagnostic

on:
  push:
    branches:
      - internal-correction-v2
    paths:
      - .github/workflows/reentry-full-regression-diagnostic.yml

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e .
      - name: Run full pytest regression
        run: pytest -q
