name: RE-ENTRY Sector Subsector Ranking

on:
  workflow_dispatch:
  push:
    branches:
      - sector-subsector-reentry-ranking
    paths:
      - 'tools/reentry_sector_subsector_ranking.py'
      - 'tools/reentry_sector_subsector_ranking_audited.py'
      - 'tools/reentry_subsector_proxy_universe.py'
      - 'tools/reentry_subsector_intelligence.py'
      - '.github/workflows/reentry-sector-subsector-ranking.yml'

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance lxml pytest
      - name: Run original ranking for comparison
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_sector_subsector_ranking.py
      - name: Run audited proxy ranking
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_sector_subsector_ranking_audited.py
      - name: Build canonical completed-close snapshot with audited universe
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_live_snapshot.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reentry-sector-subsector-ranking
          path: |
            artifacts/reentry_sector_subsector_ranking/
            artifacts/reentry_sector_subsector_ranking_audited/
            artifacts/reentry/live_completed_close.json
