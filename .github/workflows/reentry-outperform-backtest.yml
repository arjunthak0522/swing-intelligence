name: RE-ENTRY Outperform Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - internal-correction-v2
    paths:
      - 'tools/reentry_outperform_ranking.py'
      - 'tools/reentry_outperform_backtest.py'
      - 'tools/reentry_conditional_outperform_backtest.py'
      - 'tools/reentry_outperform_confidence_test.py'
      - '.github/workflows/reentry-outperform-backtest.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance lxml pytest
      - name: Run simple dynamic ranking backtest
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_outperform_backtest.py
      - name: Run prior-only conditional ranking backtest
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_conditional_outperform_backtest.py
      - name: Run confidence-gated highlight test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_outperform_confidence_test.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reentry-outperform-backtest
          path: |
            artifacts/reentry_outperform_backtest/
            artifacts/reentry_conditional_outperform/
            artifacts/reentry_outperform_confidence/
