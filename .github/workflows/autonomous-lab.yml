name: SPY QQQ Autonomous Lab

on:
  push:
    branches:
      - spy-qqq-autonomous-lab
    paths:
      - 'src/swing_intelligence/autonomous_lab.py'
      - 'tests/test_autonomous_lab.py'
      - '.github/workflows/autonomous-lab.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: pip install -e '.[dev]'
      - name: Run autonomous lab tests
        run: pytest -q tests/test_autonomous_lab.py
