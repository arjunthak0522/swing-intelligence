name: SPY QQQ Autonomous Lab

on:
  push:
    branches:
      - spy-qqq-autonomous-lab
    paths:
      - 'src/swing_intelligence/autonomous_lab.py'
      - 'src/swing_intelligence/autonomous_robustness.py'
      - 'src/swing_intelligence/data.py'
      - 'src/swing_intelligence/market_state.py'
      - 'src/swing_intelligence/market_state_hypotheses.py'
      - 'src/swing_intelligence/semantic_lab.py'
      - 'src/swing_intelligence/phase2b_validation.py'
      - 'src/swing_intelligence/walk_forward.py'
      - 'src/swing_intelligence/conditional_search.py'
      - 'src/swing_intelligence/qqq_family_robustness.py'
      - 'src/swing_intelligence/opportunity_score.py'
      - 'src/swing_intelligence/opportunity_score_stress.py'
      - 'src/swing_intelligence/strategy_equity_curve.py'
      - 'src/swing_intelligence/cash_deployment.py'
      - 'src/swing_intelligence/cash_deployment_episodes.py'
      - 'src/swing_intelligence/score_accelerated_dca.py'
      - 'src/swing_intelligence/correction_reentry.py'
      - 'src/swing_intelligence/correction_strategy_tournament.py'
      - 'tests/test_autonomous_lab.py'
      - 'tests/test_autonomous_robustness.py'
      - 'tests/test_semantic_lab.py'
      - 'tests/test_phase2b_validation.py'
      - 'tests/test_walk_forward.py'
      - 'tests/test_conditional_search.py'
      - 'tests/test_qqq_family_robustness.py'
      - 'tests/test_macro_context.py'
      - 'tests/test_opportunity_score.py'
      - 'tests/test_opportunity_score_stress.py'
      - 'tests/test_strategy_equity_curve.py'
      - 'tests/test_cash_deployment.py'
      - 'tests/test_cash_deployment_episodes.py'
      - 'tests/test_score_accelerated_dca.py'
      - 'tests/test_correction_reentry.py'
      - 'tests/test_correction_strategy_tournament.py'
      - 'tools/run_autonomous_lab.py'
      - 'tools/run_cash_deployment.py'
      - 'tools/run_cash_deployment_episodes.py'
      - 'tools/run_score_accelerated_dca.py'
      - 'tools/run_correction_reentry.py'
      - 'tools/run_correction_strategy_tournament.py'
      - '.github/workflows/autonomous-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: pip install -e '.[dev]'
      - name: Run autonomous lab tests
        run: pytest -q tests/test_autonomous_lab.py tests/test_autonomous_robustness.py tests/test_semantic_lab.py tests/test_phase2b_validation.py tests/test_walk_forward.py tests/test_conditional_search.py tests/test_qqq_family_robustness.py tests/test_macro_context.py tests/test_opportunity_score.py tests/test_opportunity_score_stress.py tests/test_strategy_equity_curve.py tests/test_cash_deployment.py tests/test_cash_deployment_episodes.py tests/test_score_accelerated_dca.py tests/test_correction_reentry.py tests/test_correction_strategy_tournament.py

  research:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e .
      - name: Run real-data SPY QQQ lab
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/run_autonomous_lab.py
      - name: Run Phase 5A cash deployment comparison
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/run_cash_deployment.py
      - name: Run Phase 5B repeated cash deployment episodes
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/run_cash_deployment_episodes.py
      - name: Run Phase 6A score accelerated DCA
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/run_score_accelerated_dca.py
      - name: Run Phase 7 correction-only re-entry validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/run_correction_reentry.py
      - name: Run Phase 8 correction strategy tournament
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/run_correction_strategy_tournament.py
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: spy-qqq-autonomous-lab-evidence
          path: artifacts/autonomous_lab/
          retention-days: 14
