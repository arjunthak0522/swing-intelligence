name: RE-ENTRY DEPLOY Window Decay Research

on:
  push:
    branches:
      - research/deploy-window-decay
    paths:
      - 'tools/reentry_deploy_window_decay.py'
      - 'tools/reentry_walkforward_validation.py'
      - 'tools/reentry_confidence.py'
      - 'tools/reentry_decision.py'
      - '.github/workflows/reentry-deploy-window-decay.yml'
  workflow_dispatch:

concurrency:
  group: reentry-deploy-window-decay-research
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run DEPLOY window decay validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_deploy_window_decay.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reentry-deploy-window-decay
          path: artifacts/reentry_deploy_window_decay/**
          if-no-files-found: warn
          retention-days: 14
