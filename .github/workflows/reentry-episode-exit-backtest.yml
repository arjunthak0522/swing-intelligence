name: RE-ENTRY Episode Exit Backtest

on:
  workflow_dispatch:
  push:
    branches: [internal-correction-v2]
    paths:
      - 'tools/reentry_episode_exit_backtest.py'
      - '.github/workflows/reentry-episode-exit-backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy yfinance lxml pytest
      - name: Run episode exit backtest
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_episode_exit_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: reentry-episode-exit-backtest
          path: artifacts/reentry_episode_exit/
