name: Breadth Source Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'tools/breadth_source_diagnostic.py'
      - '.github/workflows/breadth-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas
      - name: Run breadth source diagnostic
        run: python tools/breadth_source_diagnostic.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: breadth-source-diagnostic
          path: artifacts/breadth_source_diagnostic/**
          retention-days: 7
