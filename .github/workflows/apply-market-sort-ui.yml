name: Apply market sort UI

on:
  push:
    branches:
      - sector-subsector-sort-20260908
    paths:
      - 'tools/apply_market_sort_ui.py'
      - 'web/app/MarketMovementTables.tsx'
      - '.github/workflows/apply-market-sort-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sort-ui-bot]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sector-subsector-sort-20260908
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python tools/apply_market_sort_ui.py
      - name: Commit patched UI
        run: |
          git config user.name "re-entry-ui[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/page.tsx web/app/globals.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add sector and subsector sort controls [sort-ui-bot]"
          git push origin HEAD:sector-subsector-sort-20260908
