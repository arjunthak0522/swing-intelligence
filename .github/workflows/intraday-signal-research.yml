name: Intraday signal research

on:
  push:
    branches: [intraday-signal-research]
    paths:
      - "tools/intraday_signal_validation.py"
      - ".github/workflows/intraday-signal-research.yml"
      - "web/public/reentry/validation/historical_episode_ledger_2026-09-09.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run research validation
        run: python tools/intraday_signal_validation.py
      - name: Persist research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/intraday_signal_validation.json research/intraday_signal_validation.md
          if git diff --cached --quiet; then
            echo "No research output changes"
          else
            git commit -m "Persist intraday signal research results"
            git push origin HEAD:intraday-signal-research
          fi
