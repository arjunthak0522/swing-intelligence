name: Intraday signal research

on:
  push:
    branches: [intraday-signal-research]
    paths:
      - "tools/intraday_signal_validation.py"
      - "tools/intraday_signal_robustness.py"
      - ".github/workflows/intraday-signal-research.yml"
      - "web/public/reentry/validation/historical_episode_ledger_2026-09-09.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch null-safe broad confirmation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/intraday_signal_validation.py')
          s = p.read_text()
          old = '"both_indices_positive": len(broad_moves) == 2 and all(x > 0 for x in broad_moves),'
          new = '"both_indices_positive": len([x for x in broad_moves if isinstance(x, (int, float)) and math.isfinite(x)]) == 2 and all(x > 0 for x in broad_moves if isinstance(x, (int, float)) and math.isfinite(x)),'
          if old in s:
              p.write_text(s.replace(old, new))
          PY
      - name: Run recent 5-minute validation
        run: python tools/intraday_signal_validation.py
      - name: Run two-year hourly robustness validation
        run: python tools/intraday_signal_robustness.py
      - name: Persist research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/intraday_signal_validation.json research/intraday_signal_validation.md research/intraday_signal_robustness.json research/intraday_signal_robustness.md
          if git diff --cached --quiet; then
            echo "No research output changes"
          else
            git commit -m "Persist intraday signal research results"
            git push origin HEAD:intraday-signal-research
          fi
