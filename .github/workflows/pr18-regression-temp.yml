name: PR18 Isolated Regression Temp

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install --quiet pytest pandas numpy yfinance requests beautifulsoup4 pyyaml

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            tools/reentry_options_sentiment_live.py \
            tools/reentry_secondary_confirmation.py \
            tools/reentry_secondary_family_validation.py \
            tools/reentry_indicator_completeness.py \
            tools/reentry_ndx_single_stock_skew.py

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_reentry_options_sentiment_t1.py \
            tests/test_reentry_ndx_single_stock_skew.py \
            tests/test_reentry_secondary_validation_t1.py \
            tests/test_reentry_window_state.py

      - name: Test same-session context carry-forward
        run: |
          python - <<'PY'
          import copy
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/reentry-exhaustion-intraday-scheduler.yml').read_text())
          steps = workflow['jobs']['snapshot']['steps']
          step = next(s for s in steps if s.get('name') == 'Carry forward same-session indicator context')
          script = step['run']

          def run_case(current_date, prior_date):
              with tempfile.TemporaryDirectory() as td:
                  root = Path(td)
                  data = root / 'data/reentry'
                  data.mkdir(parents=True)
                  decision = {
                      'engine_version':'REENTRY_UNIFIED_v1',
                      'deployment_signal':'DEPLOY',
                      'state':'GO_EARLY',
                      'decision':'GO_EARLY',
                      'market_date':current_date,
                      'timestamp_et':f'{current_date}T11:00:00-04:00',
                      'go_triggered_at_et':f'{current_date}T09:40:00-04:00'
                  }
                  current = {'values':{'market_date':current_date}, 'unified_engine':copy.deepcopy(decision)}
                  prior = {
                      'values':{'market_date':prior_date},
                      'unified_engine':{'market_date':prior_date},
                      'secondary_confirmation':{'families':{'options_sentiment':{'decision_input':False}}},
                      'leading_indicators':{'indicators':{'ndx_single_stock_skew':{'decision_input':False}}},
                      'indicator_completeness':{'contract':'complete'}
                  }
                  (data/'exhaustion_intraday_current.json').write_text(json.dumps(current))
                  backup = Path('/tmp/reentry-canonical-before-run.json')
                  backup.write_text(json.dumps(prior))
                  subprocess.run(['bash','-lc',script],cwd=root,check=True)
                  after=json.loads((data/'exhaustion_intraday_current.json').read_text())
                  return decision, after

          decision, same = run_case('2026-09-18','2026-09-18')
          assert same['secondary_confirmation']['families']['options_sentiment']['decision_input'] is False
          assert same['leading_indicators']['indicators']['ndx_single_stock_skew']['decision_input'] is False
          assert same['indicator_completeness']['contract'] == 'complete'
          for key,value in decision.items():
              assert same['unified_engine'].get(key) == value, (key, same['unified_engine'].get(key), value)

          _, cross = run_case('2026-09-18','2026-09-17')
          assert 'secondary_confirmation' not in cross
          assert 'leading_indicators' not in cross
          assert 'indicator_completeness' not in cross
          print('same-session context carry-forward PASS')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify core engine file is unchanged from main
        run: |
          git fetch origin main
          git diff --exit-code origin/main...HEAD -- tools/reentry_unified_engine.py

      - name: Verify new context remains non-decisioning
        run: |
          grep -q '"decision_input": False' tools/reentry_ndx_single_stock_skew.py
          grep -q '"changes_deploy_trigger": False' tools/reentry_ndx_single_stock_skew.py
          grep -q '"changes_recovery_stage": False' tools/reentry_ndx_single_stock_skew.py
