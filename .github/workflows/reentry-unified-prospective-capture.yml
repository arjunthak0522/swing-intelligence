name: RE-ENTRY Unified Prospective Capture

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 13-22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: reentry-unified-prospective-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RE-ENTRY dependencies
        run: python -m pip install --quiet pandas yfinance
      - name: Capture breadth and fast reversal families
        run: python tools/reentry_exhaustion_intraday.py
      - name: Calculate MMFD and VVIX
        run: python tools/reentry_mmfd_intraday.py
      - name: Calculate SPX downside skew
        run: python tools/reentry_skew_intraday.py
      - name: Calculate unified RE-ENTRY decision
        run: python tools/reentry_unified_engine.py
      - name: Finalize canonical unified snapshot
        run: python tools/reentry_unified_snapshot_finalize.py
      - name: Persist prospective point-in-time snapshot
        run: |
          if [ -z "$(git status --porcelain -- data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json data/reentry/skew_intraday_history.csv data/reentry/unified_engine_history.csv data/reentry/unified_snapshot_ledger.csv)" ]; then
            echo "No prospective RE-ENTRY state change"
            exit 0
          fi
          git config user.name "re-entry-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json data/reentry/skew_intraday_history.csv data/reentry/unified_engine_history.csv data/reentry/unified_snapshot_ledger.csv
          git commit -m "Capture prospective unified RE-ENTRY state [skip ci]"
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research
