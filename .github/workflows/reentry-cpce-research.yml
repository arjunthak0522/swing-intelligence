name: RE-ENTRY CPCE Research Capture

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 13-22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: reentry-cpce-research
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture CPCE research observation
        run: python tools/reentry_cpce_research.py
      - name: Persist CPCE research data
        run: |
          files="data/reentry/cpce_research_current.json data/reentry/cpce_research_history.csv"
          if [ -z "$(git status --porcelain -- $files)" ]; then
            echo "No CPCE research update"
            exit 0
          fi
          git config user.name "re-entry-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Capture CPCE research observation [skip ci]"
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research
