name: Re-entry Confidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/reentry_confidence.py'
      - 'tools/reentry_decision.py'
      - '.github/workflows/reentry-confidence.yml'

concurrency:
  group: swing-intelligence-twelve-data
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run continuous re-entry decision
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_decision.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: reentry-confidence
          path: artifacts/reentry_confidence/**
          retention-days: 14
