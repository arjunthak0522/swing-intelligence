name: Retry unified RE-ENTRY UI migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unified-ui-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse validated migration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/unified-ui-migration.yml').read_text()
          start = text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = text.index("\n          PY", start)
          lines = text[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/patch.py').write_text(code + '\n')
          PY
          python /tmp/patch.py
      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit and push unified UI
        run: |
          git config user.name 're-entry-ui[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A web
          git commit -m 'Make unified RE-ENTRY engine the single dashboard decision [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      # retry after legacy engine retirement completed
