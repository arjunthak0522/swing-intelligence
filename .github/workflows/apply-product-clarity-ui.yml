name: Apply RE-ENTRY product clarity UI

on:
  push:
    branches: [product-clarity-historical-evidence-20260908]
    paths:
      - 'tools/apply_product_clarity_ui.py'
      - '.github/workflows/apply-product-clarity-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python tools/apply_product_clarity_ui.py
      - name: Commit UI changes
        run: |
          if git diff --quiet -- web/app/page.tsx web/app/globals.css; then
            echo "UI already applied"
            exit 0
          fi
          git config user.name "re-entry-ui[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/page.tsx web/app/globals.css
          git commit -m "Clarify RE-ENTRY product purpose and evidence hierarchy [ui-bot]"
          git push origin HEAD:${GITHUB_REF_NAME}
