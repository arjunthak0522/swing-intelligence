name: Add SKEW dashboard context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-skew-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add SKEW fields and card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/app/MarketMovementTables.tsx')
          s = p.read_text()

          old = '''    VVIX_DIRECTION?: string | null;\n    NYMO?: number | null;'''
          new = '''    VVIX_DIRECTION?: string | null;\n    SKEW_LIVE_PROXY?: number | null;\n    SKEW_LIVE_PROXY_RATIO?: number | null;\n    SKEW_DIRECTION?: string | null;\n    SKEW_OFFICIAL_CLOSE?: number | null;\n    SKEW_OFFICIAL_PERCENTILE_2Y?: number | null;\n    NYMO?: number | null;'''
          if old not in s:
              raise SystemExit('Missing SKEW type insertion point')
          s = s.replace(old, new, 1)

          marker = '''function momentumState(value?: number | null) {'''
          fn = '''function skewState(percentile?: number | null, direction?: string | null) {\n  if (!finite(percentile)) return { label: "UNAVAILABLE", cls: "muted", note: "Waiting for SPX tail-risk context." };\n  const dir = (direction || "").toUpperCase();\n  const live = dir === "WIDENING" ? " Live downside skew is widening." : dir === "NARROWING" ? " Live downside skew is narrowing." : dir === "FLAT" ? " Live downside skew is roughly unchanged." : "";\n  if (Number(percentile) >= 95) return { label: "EXTREME TAIL RISK", cls: "bad-text", note: `Official SKEW is above 95% of its two-year history.${live}` };\n  if (Number(percentile) >= 80) return { label: "HIGH TAIL RISK", cls: "bad-text", note: `Official SKEW is in the top 20% of its two-year history.${live}` };\n  if (Number(percentile) >= 60) return { label: "ELEVATED", cls: "warn", note: `Tail-risk pricing is above normal.${live}` };\n  if (Number(percentile) >= 20) return { label: "NORMAL", cls: "muted", note: `Tail-risk pricing is in a normal historical zone.${live}` };\n  return { label: "LOW TAIL RISK", cls: "good-text", note: `Tail-risk pricing is unusually subdued.${live}` };\n}\n\n'''
          if marker not in s:
              raise SystemExit('Missing skewState insertion point')
          s = s.replace(marker, fn + marker, 1)

          vvix_card = '''          <MetricStat label="Volatility of VIX (VVIX)" value={plain(w?.VVIX, 1)} state={vvixState(w?.VVIX_PERCENTILE_2Y, w?.VVIX_DIRECTION)} reference="2Y percentile: <20 calm · 20-60 normal · 60-80 elevated · 80-95 high · 95+ extreme" note={`${vvixState(w?.VVIX_PERCENTILE_2Y, w?.VVIX_DIRECTION).note}${finite(w?.VVIX_PERCENTILE_2Y) ? ` ${plain(w?.VVIX_PERCENTILE_2Y, 0)}th percentile.` : ""}`} marker={position(w?.VVIX_PERCENTILE_2Y, 0, 100)} />'''
          skew_card = vvix_card + '''\n          <MetricStat label="S&P 500 tail-risk pricing (SKEW)" value={`${signed(w?.SKEW_LIVE_PROXY, 1)} vol pts`} state={skewState(w?.SKEW_OFFICIAL_PERCENTILE_2Y, w?.SKEW_DIRECTION)} reference="Live proxy = 25-delta SPX put IV minus call IV · higher/widening = more downside hedging" note={`${skewState(w?.SKEW_OFFICIAL_PERCENTILE_2Y, w?.SKEW_DIRECTION).note}${finite(w?.SKEW_OFFICIAL_CLOSE) ? ` Official SKEW close ${plain(w?.SKEW_OFFICIAL_CLOSE, 1)}.` : ""}${finite(w?.SKEW_OFFICIAL_PERCENTILE_2Y) ? ` ${plain(w?.SKEW_OFFICIAL_PERCENTILE_2Y, 0)}th percentile over 2Y.` : ""}`} marker={position(w?.SKEW_OFFICIAL_PERCENTILE_2Y, 0, 100)} />'''
          if vvix_card not in s:
              raise SystemExit('Missing VVIX card insertion point')
          s = s.replace(vvix_card, skew_card, 1)
          p.write_text(s)
          PY
      - name: Commit SKEW dashboard card
        run: |
          git config user.name 're-entry-ui[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/MarketMovementTables.tsx
          git commit -m 'Add live S&P 500 tail-risk pricing context [skip ci]'
          git push
