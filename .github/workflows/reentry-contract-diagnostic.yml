name: RE-ENTRY Full Regression Diagnostic

on:
  push:
    branches: [internal-correction-v2]
    paths:
      - '.github/workflows/reentry-contract-diagnostic.yml'

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance lxml pytest
      - name: Run full pytest regression
        run: pytest -q
