name: Washout Worthiness

on:
  push:
    branches: [main]
    paths:
      - 'tools/washout_worthiness.py'
      - '.github/workflows/washout-worthiness.yml'

permissions:
  contents: read

jobs:
  worthiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run frozen washout worthiness test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/washout_worthiness.py
      - name: Upload washout results
        uses: actions/upload-artifact@v4
        with:
          name: washout-worthiness
          path: artifacts/washout_worthiness/**
          retention-days: 14
