name: RE-ENTRY NASI Bootstrap Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [intraday-signal-research]
    paths:
      - 'tools/reentry_nasi_bootstrap_diagnostic.py'
      - '.github/workflows/reentry-nasi-bootstrap-diagnostic.yml'
  schedule:
    - cron: '35 21 * * 5'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run NASI bootstrap diagnostic
        run: python tools/reentry_nasi_bootstrap_diagnostic.py
      - name: Commit diagnostic when changed
        run: |
          files="research/reentry_nasi_bootstrap_diagnostic.json research/reentry_nasi_bootstrap_diagnostic.md"
          if [ -z "$(git status --porcelain -- $files)" ]; then
            echo "No NASI diagnostic change"
            exit 0
          fi
          git config user.name "re-entry-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Update NASI bootstrap diagnostic [skip ci]"
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research
