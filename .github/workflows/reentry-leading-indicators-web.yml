name: RE-ENTRY Leading Indicators Web Check

on:
  push:
    branches:
      - leading-indicators-research
    paths:
      - 'web/**'
      - '.github/workflows/reentry-leading-indicators-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leading-indicators-research
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
