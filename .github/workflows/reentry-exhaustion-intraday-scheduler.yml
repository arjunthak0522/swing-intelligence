name: RE-ENTRY Unified Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reentry-exhaustion-intraday-scheduler.yml'
  schedule:
    # Default-branch scheduler. Collectors themselves enforce the 09:30-16:45 ET window.
    - cron: '*/15 13-22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: reentry-unified-engine
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout RE-ENTRY engine source
        uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RE-ENTRY dependencies
        run: python -m pip install --quiet pandas yfinance

      - name: Calculate breadth and fast reversal families
        run: python tools/reentry_exhaustion_intraday.py

      - name: Calculate MMFD and VVIX
        run: python tools/reentry_mmfd_intraday.py

      - name: Calculate SPX downside skew
        continue-on-error: true
        run: python tools/reentry_skew_intraday.py

      - name: Calculate the single RE-ENTRY decision
        run: python tools/reentry_unified_engine.py

      - name: Finalize canonical unified snapshot
        run: python tools/reentry_unified_snapshot_finalize.py

      - name: Persist unified RE-ENTRY output
        run: |
          if [ -z "$(git status --porcelain -- data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json data/reentry/skew_intraday_history.csv data/reentry/unified_engine_history.csv data/reentry/unified_snapshot_ledger.csv)" ]; then
            echo 'No RE-ENTRY state change'
            exit 0
          fi
          git config user.name 're-entry-engine[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json data/reentry/skew_intraday_history.csv data/reentry/unified_engine_history.csv data/reentry/unified_snapshot_ledger.csv
          git commit -m "Record unified RE-ENTRY state [skip ci]"
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research

      - name: Upload unified RE-ENTRY snapshot
        uses: actions/upload-artifact@v4
        with:
          name: reentry-unified-engine
          path: |
            data/reentry/exhaustion_intraday_history.csv
            data/reentry/exhaustion_intraday_current.json
            data/reentry/skew_intraday_history.csv
            data/reentry/unified_engine_history.csv
            data/reentry/unified_snapshot_ledger.csv
          retention-days: 30
