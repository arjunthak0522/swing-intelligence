name: RE-ENTRY Exhaustion Intraday Scheduler

on:
  workflow_dispatch:
  schedule:
    # Broad UTC window covers US Eastern standard and daylight time.
    # The Python session guard persists only 09:30 <= ET < 16:00.
    - cron: '*/30 13-20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: reentry-exhaustion-intraday-scheduler
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout intraday research branch
        uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MMFD research dependencies
        run: python -m pip install --quiet pandas yfinance

      - name: Calculate current intraday breadth and washout state
        run: python tools/reentry_exhaustion_intraday.py

      - name: Calculate provisional live MMFD from US equity universe
        run: python tools/reentry_mmfd_intraday.py

      - name: Persist research output only
        run: |
          if [ -z "$(git status --porcelain -- data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json)" ]; then
            echo 'No valid regular-session research state change'
            exit 0
          fi
          git config user.name 're-entry-research[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json
          git commit -m "Record intraday selling exhaustion research state [skip ci]"
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research

      - name: Upload research snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: reentry-exhaustion-intraday
          path: |
            data/reentry/exhaustion_intraday_history.csv
            data/reentry/exhaustion_intraday_current.json
          retention-days: 30
