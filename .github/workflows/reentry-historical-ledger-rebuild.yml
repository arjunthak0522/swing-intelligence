name: RE-ENTRY Historical Episode Ledger Rebuild

on:
  push:
    branches: [historical-evidence-transparency-20260908]
    paths:
      - '.github/workflows/reentry-historical-ledger-rebuild.yml'
      - 'tools/reentry_historical_ledger_rebuild.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout transparency branch helper
        uses: actions/checkout@v4
        with:
          ref: historical-evidence-transparency-20260908
      - name: Preserve ledger helper
        run: cp tools/reentry_historical_ledger_rebuild.py /tmp/reentry_historical_ledger_rebuild.py
      - name: Checkout frozen validated engine
        uses: actions/checkout@v4
        with:
          ref: 47f38bf3362a97bcf9c9dd2d6545c4fae212e046
          clean: true
      - name: Restore ledger helper
        run: cp /tmp/reentry_historical_ledger_rebuild.py tools/reentry_historical_ledger_rebuild.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance requests
      - name: Build corrected continuous RE-ENTRY episode ledger
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_historical_ledger_rebuild.py
      - name: Validate ledger contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/reentry_historical_ledger/historical_episode_ledger.json')
          d=json.loads(p.read_text())
          assert d['episode_count'] > 0
          assert d['provenance']['classification'] == 'RECONSTRUCTED'
          for e in d['episodes']:
              assert 'favorable_through' in e
              assert 'SPY_episode_return' in e
              assert 'QQQ_episode_return' in e
              if e['next_state_date']:
                  assert e['next_state_date'] > e['favorable_through']
          print('ledger contract OK:', d['episode_count'], 'episodes')
          PY
      - name: Preserve generated ledger
        run: cp artifacts/reentry_historical_ledger/historical_episode_ledger.json /tmp/historical_episode_ledger.json
      - name: Checkout transparency branch for persistence
        uses: actions/checkout@v4
        with:
          ref: historical-evidence-transparency-20260908
          clean: true
      - name: Commit ledger snapshot to web data
        run: |
          mkdir -p web/public/reentry/validation
          cp /tmp/historical_episode_ledger.json web/public/reentry/validation/historical_episode_ledger_2026-09-09.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/reentry/validation/historical_episode_ledger_2026-09-09.json
          if git diff --cached --quiet; then
            echo 'Ledger snapshot unchanged'
          else
            git commit -m 'Persist reconstructed historical episode ledger'
            git push origin HEAD:historical-evidence-transparency-20260908
          fi
      - name: Upload ledger
        uses: actions/upload-artifact@v4
        with:
          name: reentry-historical-episode-ledger-corrected
          path: /tmp/historical_episode_ledger.json
          retention-days: 30
