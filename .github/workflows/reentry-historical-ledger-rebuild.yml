name: RE-ENTRY Historical Episode Ledger Rebuild

on:
  push:
    branches: [historical-evidence-transparency-20260908]
    paths:
      - '.github/workflows/reentry-historical-ledger-rebuild.yml'
  workflow_dispatch:

jobs:
  rebuild-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen validated engine
        uses: actions/checkout@v4
        with:
          ref: 47f38bf3362a97bcf9c9dd2d6545c4fae212e046
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance requests
      - name: Build contiguous RE-ENTRY episode ledger
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_episode_exit_backtest.py
      - name: Add provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/reentry_episode_exit/episode_exit_backtest.json')
          d=json.loads(p.read_text())
          d['provenance']={
            'engine_commit':'47f38bf3362a97bcf9c9dd2d6545c4fae212e046',
            'rebuild_date':'2026-09-08',
            'classification':'RECONSTRUCTED_FROM_FROZEN_ENGINE_WITH_CURRENT_VENDOR_HISTORY',
            'warning':'Episode rows are a transparent reconstruction. Canonical aggregate validation remains the preserved source of truth because vendor-adjusted historical inputs can revise.'
          }
          p.write_text(json.dumps(d, indent=2))
          PY
      - name: Upload ledger
        uses: actions/upload-artifact@v4
        with:
          name: reentry-historical-episode-ledger
          path: artifacts/reentry_episode_exit/**
          retention-days: 30
