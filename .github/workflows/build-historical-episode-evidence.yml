name: Build historical RE-ENTRY episode evidence

on:
  workflow_dispatch:
  push:
    branches: [product-clarity-historical-evidence-20260908]
    paths:
      - 'tools/build_historical_episode_evidence.py'
      - '.github/workflows/build-historical-episode-evidence.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4

      - name: Checkout frozen canonical engine
        uses: actions/checkout@v4
        with:
          ref: 47f38bf3362a97bcf9c9dd2d6545c4fae212e046
          path: canonical

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install canonical dependencies
        run: python -m pip install pandas numpy yfinance lxml

      - name: Build frozen continuous-episode evidence
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/build_historical_episode_evidence.py --canonical-root canonical

      - name: Validate evidence schema
        run: |
          python - <<'PY'
          import json
          p = json.load(open('web/public/reentry/historical_episodes.json'))
          s = p['continuous_episode_summary']
          v = p['archived_entry_timing_validation']
          check = {
            'continuous_episode_count': p['continuous_episode_count'],
            'completed_episode_count': s['completed_episode_count'],
            'active_at_sample_end_count': s['active_at_sample_end_count'],
            'archived_validation_event_count': v['validation_event_count'],
            'reconstructed_cooldown_count': p['reconstruction_diagnostic']['current_cooldown_event_count'],
            'diagnostic_status': p['reconstruction_diagnostic']['status'],
          }
          print(json.dumps(check, indent=2))
          if p['continuous_episode_count'] != len(p['continuous_episodes']):
            raise SystemExit('Continuous episode row count mismatch')
          if v['validation_event_count'] != 193:
            raise SystemExit('Archived validation-event count changed')
          if not p['continuous_episodes']:
            raise SystemExit('No continuous RE-ENTRY episodes reconstructed')
          PY

      - name: Upload frozen evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: reentry-historical-episode-evidence
          path: web/public/reentry/historical_episodes.json
          retention-days: 30
