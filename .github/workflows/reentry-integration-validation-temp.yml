name: RE-ENTRY Integration Validation Temp

on:
  workflow_dispatch:
  push:
    branches: [internal-correction-v2]
    paths:
      - '.github/workflows/reentry-integration-validation-temp.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install pandas numpy yfinance lxml pytest
      - name: Run ranking warm-up regression
        run: pytest -q tests/test_reentry_sector_subsector_ranking.py
      - name: Run full pytest regression
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Production build
        working-directory: web
        run: npm run build
