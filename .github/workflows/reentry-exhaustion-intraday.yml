name: RE-ENTRY Unified Engine Manual Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reentry-unified-manual
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RE-ENTRY dependencies
        run: python -m pip install --quiet pandas yfinance
      - name: Capture breadth and fast reversal families
        run: python tools/reentry_exhaustion_intraday.py
      - name: Calculate MMFD and VVIX
        run: python tools/reentry_mmfd_intraday.py
      - name: Calculate SPX downside skew
        run: python tools/reentry_skew_intraday.py
      - name: Calculate single RE-ENTRY decision
        run: python tools/reentry_unified_engine.py
      - name: Persist unified RE-ENTRY state
        run: |
          if [ -z "$(git status --porcelain -- data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json data/reentry/skew_intraday_history.csv data/reentry/unified_engine_history.csv)" ]; then
            echo "No RE-ENTRY state change"
            exit 0
          fi
          git config user.name "re-entry-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json data/reentry/skew_intraday_history.csv data/reentry/unified_engine_history.csv
          git commit -m "Record unified RE-ENTRY state [skip ci]"
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research
      - uses: actions/upload-artifact@v4
        with:
          name: reentry-unified-engine
          path: |
            data/reentry/exhaustion_intraday_history.csv
            data/reentry/exhaustion_intraday_current.json
            data/reentry/skew_intraday_history.csv
            data/reentry/unified_engine_history.csv
          retention-days: 30
