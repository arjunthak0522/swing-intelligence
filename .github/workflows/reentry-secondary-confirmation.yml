name: RE-ENTRY Secondary Confirmation Enrichment

# Production merges refresh the live enrichment contract.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/reentry_secondary_confirmation.py'
      - 'tools/reentry_options_sentiment_live.py'
      - 'tools/reentry_leading_indicators.py'
      - 'tools/reentry_ndx_single_stock_skew.py'
      - 'tools/reentry_indicator_completeness.py'
      - 'web/app/SecondaryConfirmation.tsx'
      - 'web/app/LeadingIndicators.tsx'
      - 'web/app/ReentryDecisionDetails.tsx'
      - 'web/app/page.tsx'
      - '.github/workflows/reentry-secondary-confirmation.yml'
  workflow_run:
    workflows: ["RE-ENTRY Unified Engine"]
    types: [completed]

permissions:
  contents: write
  id-token: write

# The canonical engine and indicator enrichment both persist to
# intraday-signal-research. Use the same concurrency group as the canonical
# workflow so only one live-data writer can run at a time.
concurrency:
  group: reentry-unified-engine
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout live data branch
        uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0

      - name: Checkout canonical main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install indicator dependencies
        run: python -m pip install --quiet pandas yfinance

      - name: Capture canonical decision before enrichment
        shell: bash
        run: |
          python - <<'PY' > /tmp/reentry-decision-before.json
          import json
          from pathlib import Path
          payload = json.loads(Path('data/reentry/exhaustion_intraday_current.json').read_text(encoding='utf-8'))
          engine = payload.get('unified_engine') or {}
          keys = [
              'engine_version', 'deployment_signal', 'market_condition', 'recovery_stage',
              'confirmation_strength', 'oversold_gate', 'fast_family_count',
              'context_support_count', 'state', 'decision', 'go_triggered_at_et'
          ]
          print(json.dumps({key: engine.get(key) for key in keys}, sort_keys=True))
          PY

      - name: Enrich canonical snapshot with secondary confirmations
        continue-on-error: true
        run: |
          python _main/tools/reentry_secondary_confirmation.py \
            --snapshot data/reentry/exhaustion_intraday_current.json \
            --history data/reentry/secondary_confirmation_history.csv

      - name: Refresh options sentiment with CPCE T+1 integrity
        continue-on-error: true
        run: |
          python _main/tools/reentry_options_sentiment_live.py \
            --snapshot data/reentry/exhaustion_intraday_current.json

      - name: Add leading indicators
        continue-on-error: true
        run: |
          python _main/tools/reentry_leading_indicators.py \
            --snapshot data/reentry/exhaustion_intraday_current.json \
            --breadth-history data/reentry/exhaustion_intraday_history.csv

      - name: Add Nasdaq-100 single-stock skew context
        continue-on-error: true
        run: |
          python _main/tools/reentry_ndx_single_stock_skew.py \
            --snapshot data/reentry/exhaustion_intraday_current.json \
            --history data/reentry/ndx_single_stock_skew_history.csv

      - name: Enforce complete indicator and close-only fallback contract
        run: |
          python _main/tools/reentry_indicator_completeness.py \
            --snapshot data/reentry/exhaustion_intraday_current.json

      - name: Verify decision immutability and indicator completeness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/reentry-decision-before.json').read_text(encoding='utf-8'))
          payload = json.loads(Path('data/reentry/exhaustion_intraday_current.json').read_text(encoding='utf-8'))
          engine = payload.get('unified_engine') or {}
          after = {key: engine.get(key) for key in before}
          if before != after:
              raise SystemExit(f'Indicator enrichment modified canonical decision fields. before={before} after={after}')

          leading = payload.get('leading_indicators') or {}
          lead_keys = set((leading.get('indicators') or {}).keys())
          expected_lead = {'zweig_breadth_thrust','mcclellan_velocity','nasdaq_short_breadth','credit_risk_turn','ndx_single_stock_skew'}
          if not expected_lead.issubset(lead_keys):
              raise SystemExit(f'Missing leading indicator cards: {sorted(expected_lead - lead_keys)}')

          secondary = payload.get('secondary_confirmation') or {}
          family_keys = set((secondary.get('families') or {}).keys())
          expected_secondary = {'vol_structure','breadth_thrust','risk_appetite','options_sentiment'}
          if not expected_secondary.issubset(family_keys):
              raise SystemExit(f'Missing secondary indicator cards: {sorted(expected_secondary - family_keys)}')
          options = (secondary.get('families') or {}).get('options_sentiment') or {}
          if options.get('final_daily_t_plus_one_enforced') is not True:
              raise SystemExit('Options sentiment does not declare finalized daily CPCE T+1 enforcement')
          obs = options.get('official_daily_observation_date')
          requested = options.get('requested_market_date')
          if obs and requested and obs >= requested:
              raise SystemExit(f'Look-ahead guard failed: official CPCE observation {obs} cannot be used for session {requested}')
          if 't2108' not in (secondary.get('breadth_context') or {}):
              raise SystemExit('Missing NYSE 40-day breadth context card')
          if not isinstance(payload.get('skew_live'), dict):
              raise SystemExit('Missing SKEW card')
          if not isinstance(payload.get('indicator_completeness'), dict):
              raise SystemExit('Missing indicator completeness metadata')

          print('Complete indicator contract PASS')
          print(json.dumps({
              'deployment_signal': engine.get('deployment_signal'),
              'market_condition': engine.get('market_condition'),
              'recovery_stage': engine.get('recovery_stage'),
              'leading_indicators': sorted(lead_keys),
              'secondary_families': sorted(family_keys),
              'cpce_t_plus_one': options.get('final_daily_t_plus_one_enforced'),
              'cpce_official_observation': obs,
              'ndx_skew_status': ((leading.get('indicators') or {}).get('ndx_single_stock_skew') or {}).get('status'),
              'skew_freshness': (payload.get('skew_live') or {}).get('freshness_state'),
          }, indent=2))
          PY

      - name: Persist enriched canonical snapshot
        run: |
          git config user.name 're-entry-engine[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reentry/exhaustion_intraday_current.json
          if [ -f data/reentry/secondary_confirmation_history.csv ]; then
            git add data/reentry/secondary_confirmation_history.csv
          fi
          if [ -f data/reentry/ndx_single_stock_skew_history.csv ]; then
            git add data/reentry/ndx_single_stock_skew_history.csv
          fi
          if git diff --cached --quiet; then
            echo 'No indicator-enrichment state change'
            exit 0
          fi
          git commit -m "Record complete RE-ENTRY indicator context [skip ci]"
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research

      - name: Publish enriched canonical snapshot to Supabase
        env:
          SUPABASE_REENTRY_URL: https://gexrdfzxmlnaawzmtlrk.supabase.co/functions/v1/reentry-intraday
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=reentry-supabase")"
          OIDC_TOKEN="$(printf '%s' "$TOKEN_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          python - <<'PY' > /tmp/reentry-publish.json
          import json
          from pathlib import Path
          snapshot = json.loads(Path('data/reentry/exhaustion_intraday_current.json').read_text(encoding='utf-8'))
          print(json.dumps({'snapshot': snapshot}))
          PY
          HTTP_CODE="$(curl -sS -o /tmp/reentry-publish-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/reentry-publish.json \
            "$SUPABASE_REENTRY_URL")"
          cat /tmp/reentry-publish-response.json
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Supabase publish failed with HTTP $HTTP_CODE" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          response = json.load(open('/tmp/reentry-publish-response.json', encoding='utf-8'))
          if response.get('ok') is not True:
              raise SystemExit(f"Supabase publish did not confirm success: {response}")
          print('Supabase complete canonical snapshot publish confirmed.')
          PY

      - name: Upload confirmation artifact
        uses: actions/upload-artifact@v4
        with:
          name: reentry-complete-indicator-context
          path: |
            data/reentry/exhaustion_intraday_current.json
            data/reentry/secondary_confirmation_history.csv
            data/reentry/ndx_single_stock_skew_history.csv
          retention-days: 30
