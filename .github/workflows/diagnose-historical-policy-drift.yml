name: Diagnose historical policy drift

on:
  push:
    branches: [product-clarity-historical-evidence-20260908]
    paths:
      - 'tools/diagnose_historical_policy_drift.py'
      - '.github/workflows/diagnose-historical-policy-drift.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 47f38bf3362a97bcf9c9dd2d6545c4fae212e046
          path: canonical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy yfinance lxml
      - name: Run drift diagnostics
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/diagnose_historical_policy_drift.py --canonical-root canonical
      - uses: actions/upload-artifact@v4
        with:
          name: historical-policy-drift
          path: artifacts/historical_policy_drift.json
          retention-days: 30
