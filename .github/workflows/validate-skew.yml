name: Validate SKEW research feed

on:
  push:
    branches: [intraday-signal-research]
    paths:
      - '.github/workflows/validate-skew.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas yfinance
      - name: Refresh base intraday snapshot
        run: python tools/reentry_exhaustion_intraday.py
      - name: Refresh MMFD and VVIX
        run: python tools/reentry_mmfd_intraday.py
      - name: Validate live SPX downside skew
        run: python tools/reentry_skew_intraday.py
      - name: Persist validation output
        run: |
          git config user.name 're-entry-research[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json data/reentry/skew_intraday_history.csv
          git commit -m 'Validate live S&P 500 tail-risk context [skip ci]'
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research
