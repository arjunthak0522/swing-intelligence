name: RE-ENTRY Complete Indicator Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: reentry-unified-engine
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout RE-ENTRY live data branch
        uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 2

      - name: Checkout canonical main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install completeness dependencies
        run: python -m pip install --quiet pandas yfinance

      - name: Capture canonical decision before enrichment
        shell: bash
        run: |
          python - <<'PY' > /tmp/reentry-decision-before.json
          import json
          from pathlib import Path
          payload = json.loads(Path('data/reentry/exhaustion_intraday_current.json').read_text(encoding='utf-8'))
          engine = payload.get('unified_engine') or {}
          keys = ['engine_version','deployment_signal','market_condition','recovery_stage','confirmation_strength','oversold_gate','fast_family_count','context_support_count','state','decision','go_triggered_at_et']
          print(json.dumps({key: engine.get(key) for key in keys}, sort_keys=True))
          PY

      - name: Carry forward complete indicator context immediately
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json, subprocess
          from pathlib import Path

          path = Path('data/reentry/exhaustion_intraday_current.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          engine = payload.get('unified_engine') or {}
          stamp = engine.get('timestamp_et') or (payload.get('values') or {}).get('timestamp_et')
          market_date = engine.get('market_date') or (payload.get('values') or {}).get('market_date')

          prior = {}
          try:
              raw = subprocess.check_output(['git','show','HEAD^:data/reentry/exhaustion_intraday_current.json'], text=True)
              prior = json.loads(raw)
          except Exception as exc:
              print(f'Prior enriched snapshot unavailable: {exc}')

          for key in ('secondary_confirmation','leading_indicators'):
              if not isinstance(payload.get(key), dict) and isinstance(prior.get(key), dict):
                  payload[key] = copy.deepcopy(prior[key])
              if isinstance(payload.get(key), dict):
                  payload[key]['carried_forward_at_et'] = stamp
                  payload[key]['carry_forward_reason'] = 'Latest available context retained while core intraday feeds refresh.'
                  if isinstance(engine, dict):
                      engine[key] = copy.deepcopy(payload[key])

          current_skew = payload.get('skew_live') if isinstance(payload.get('skew_live'), dict) else {}
          prior_skew = prior.get('skew_live') if isinstance(prior.get('skew_live'), dict) else {}
          current_value = current_skew.get('ratio') or current_skew.get('value') or current_skew.get('official_skew')
          prior_value = prior_skew.get('ratio') or prior_skew.get('value') or prior_skew.get('official_skew')
          if current_value is None and prior_value is not None:
              payload['skew_live'] = copy.deepcopy(prior_skew)
              payload['skew_live']['freshness_state'] = 'PRIOR_CLOSE' if prior_skew.get('freshness_type') == 'DAILY_CLOSE' else 'DELAYED'
              payload['skew_live']['carried_forward_at_et'] = stamp

          payload['unified_engine'] = engine
          payload['complete_indicator_snapshot'] = {
              'status': 'COMPLETE_WITH_LATEST_AVAILABLE',
              'timestamp_et': stamp,
              'market_date': market_date,
              'policy': 'Never omit a defined indicator because its source is delayed or close-only. Retain latest valid observation with explicit freshness.',
          }
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Enforce complete indicator and freshness contract
        run: |
          python _main/tools/reentry_indicator_completeness.py --snapshot data/reentry/exhaustion_intraday_current.json

      - name: Verify decision immutability and indicator completeness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/reentry-decision-before.json').read_text(encoding='utf-8'))
          payload = json.loads(Path('data/reentry/exhaustion_intraday_current.json').read_text(encoding='utf-8'))
          engine = payload.get('unified_engine') or {}
          after = {key: engine.get(key) for key in before}
          if before != after:
              raise SystemExit(f'Indicator enrichment modified canonical decision fields. before={before} after={after}')
          leading = payload.get('leading_indicators') or {}
          lead_keys = set((leading.get('indicators') or {}).keys())
          expected_lead = {'zweig_breadth_thrust','mcclellan_velocity','nasdaq_short_breadth','credit_risk_turn','ndx_single_stock_skew'}
          secondary = payload.get('secondary_confirmation') or {}
          family_keys = set((secondary.get('families') or {}).keys())
          expected_secondary = {'vol_structure','breadth_thrust','risk_appetite','options_sentiment'}
          missing = []
          if not expected_lead.issubset(lead_keys): missing.append(f'leading={sorted(expected_lead-lead_keys)}')
          if not expected_secondary.issubset(family_keys): missing.append(f'secondary={sorted(expected_secondary-family_keys)}')
          if 't2108' not in (secondary.get('breadth_context') or {}): missing.append('t2108')
          if not isinstance(payload.get('skew_live'), dict): missing.append('skew_live')
          if missing: raise SystemExit('Missing indicator cards: ' + ', '.join(missing))
          print('Fast complete indicator contract PASS')
          PY

      - name: Persist complete canonical snapshot
        shell: bash
        run: |
          git config user.name 're-entry-engine[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reentry/exhaustion_intraday_current.json
          if git diff --cached --quiet; then echo 'No indicator enrichment change'; exit 0; fi
          git commit -m "Retain complete RE-ENTRY indicator context [skip ci]"
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research

      - name: Publish complete canonical snapshot to Supabase
        shell: bash
        env:
          SUPABASE_REENTRY_URL: https://gexrdfzxmlnaawzmtlrk.supabase.co/functions/v1/reentry-intraday
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=reentry-supabase")"
          OIDC_TOKEN="$(printf '%s' "$TOKEN_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          python - <<'PY' > /tmp/reentry-publish.json
          import json
          from pathlib import Path
          print(json.dumps({'snapshot': json.loads(Path('data/reentry/exhaustion_intraday_current.json').read_text(encoding='utf-8'))}))
          PY
          HTTP_CODE="$(curl -sS -o /tmp/reentry-publish-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/reentry-publish.json "$SUPABASE_REENTRY_URL")"
          cat /tmp/reentry-publish-response.json; echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then echo "Supabase publish failed with HTTP $HTTP_CODE" >&2; exit 1; fi
          python - <<'PY'
          import json
          response=json.load(open('/tmp/reentry-publish-response.json',encoding='utf-8'))
          if response.get('ok') is not True: raise SystemExit(f'Supabase publish did not confirm success: {response}')
          print('Supabase complete canonical snapshot publish confirmed.')
          PY
