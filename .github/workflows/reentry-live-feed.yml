name: RE-ENTRY Live Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1-5'
  push:
    branches: [main, reentry-live-feed, reentry-retail-candidate]
    paths:
      - '.github/workflows/reentry-live-feed.yml'

permissions:
  contents: write

concurrency:
  group: reentry-live-feed-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout validated canonical engine
        uses: actions/checkout@v4
        with:
          ref: 47f38bf3362a97bcf9c9dd2d6545c4fae212e046
          path: engine
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine dependencies
        run: python -m pip install pandas numpy yfinance lxml pytest

      - name: Build historical sector and subsector ranking
        working-directory: engine
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_sector_subsector_ranking.py >/tmp/reentry-ranking.log

      - name: Pace market-data requests
        run: sleep 30

      - name: Build canonical completed-close snapshot
        working-directory: engine
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_live_snapshot.py >/tmp/reentry-live.log

      - name: Validate complete retail output
        working-directory: engine
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p = Path('artifacts/reentry/live_completed_close.json')
          d = json.loads(p.read_text())
          sectors = d.get('signal_snapshot', {}).get('sectors', {})
          subsectors = d.get('subsector_intelligence', {}).get('proxies', {})
          opportunities = d.get('opportunity_evidence', {})
          if d.get('data_freshness', {}).get('same_day_complete') is not True:
              raise SystemExit('snapshot freshness check failed')
          if len(sectors) != 11:
              raise SystemExit(f'expected 11 sectors, got {len(sectors)}')
          if len(subsectors) < 30:
              raise SystemExit(f'expected at least 30 subsectors, got {len(subsectors)}')
          if opportunities.get('status') != 'CURRENT_REPAIR_PLUS_CANONICAL_HISTORY':
              raise SystemExit(f'historical opportunity evidence missing: {opportunities.get("status")}')
          for row in opportunities.get('sectors', []):
              for key in ('damage_share_3pct', 'repair_share'):
                  value = row.get(key)
                  if not isinstance(value, (int, float)) or not math.isfinite(value):
                      raise SystemExit(f'invalid sector opportunity metric: {row.get("symbol")} {key}={value}')
          print({'as_of': d.get('as_of'), 'signal': d.get('signal'), 'sectors': len(sectors), 'subsectors': len(subsectors), 'opportunity_status': opportunities.get('status'), 'sector_candidates': len(opportunities.get('sectors', [])), 'subsector_candidates': len(opportunities.get('subsectors', []))})
          PY

      - name: Checkout publishing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: publish
          fetch-depth: 0

      - name: Publish snapshot into web app
        run: |
          mkdir -p publish/web/public/reentry
          cp engine/artifacts/reentry/live_completed_close.json publish/web/public/reentry/latest.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('publish/web/public/reentry/latest.json')
          d = json.loads(p.read_text())
          d['retail_metadata'] = {
              'published_at_utc': datetime.now(timezone.utc).isoformat(),
              'engine_commit': '47f38bf3362a97bcf9c9dd2d6545c4fae212e046',
              'engine_validation': 'CANONICAL_WORKFLOW_PASS',
              'feed_mode': 'COMPLETED_CLOSE_ONLY',
              'historical_opportunity_evidence': 'REQUIRED',
          }
          p.write_text(json.dumps(d, indent=2) + '\n')
          PY

      - name: Update re-entry episode state
        run: |
          python engine/tools/reentry_episode_state.py \
            --snapshot publish/web/public/reentry/latest.json \
            --state publish/web/public/reentry/episode.json

      - name: Commit fresh close snapshot and episode state
        working-directory: publish
        run: |
          if git diff --quiet -- web/public/reentry/latest.json web/public/reentry/episode.json && [ -z "$(git status --porcelain -- web/public/reentry/latest.json web/public/reentry/episode.json)" ]; then
            echo 'No snapshot or episode change to publish'
            exit 0
          fi
          git config user.name 're-entry-engine[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/reentry/latest.json web/public/reentry/episode.json
          ASOF=$(python -c 'import json; print(json.load(open("web/public/reentry/latest.json"))["as_of"])')
          git commit -m "Publish RE-ENTRY close feed ${ASOF} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
