name: True Breadth Re-entry Worthiness

on:
  push:
    branches: [main]
    paths:
      - 'tools/true_breadth_reentry_worthiness.py'
      - '.github/workflows/true-breadth-reentry.yml'

permissions:
  contents: read

jobs:
  worthiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run true breadth re-entry worthiness test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/true_breadth_reentry_worthiness.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: true-breadth-reentry-worthiness
          path: artifacts/true_breadth_reentry/**
          retention-days: 14
