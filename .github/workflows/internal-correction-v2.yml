name: RE-ENTRY V2 Research

on:
  workflow_dispatch:
  push:
    branches: [internal-correction-v2]
    paths:
      - 'tools/internal_correction_v2.py'
      - 'tools/internal_correction_incremental_validation.py'
      - 'tools/internal_correction_subtype_decomposition.py'
      - 'tools/internal_correction_full_v2.py'
      - 'tools/reentry_v2_engine.py'
      - 'tools/reentry_v2_policy_validation.py'
      - 'tools/reentry_v2_hidden_policy_refinement.py'
      - 'docs/internal-correction-v2-research-spec.md'
      - '.github/workflows/internal-correction-v2.yml'

permissions:
  contents: read

concurrency:
  group: reentry-v2-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance lxml
      - name: Run legacy broad/internal validation research
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/internal_correction_v2.py
      - name: Run incremental-value validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/internal_correction_incremental_validation.py
      - name: Run subtype diagnostics and QQQ-specific research
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/internal_correction_subtype_decomposition.py
      - name: Run complete V2 sector-factor state model
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/internal_correction_full_v2.py
      - name: Run canonical RE-ENTRY V2 engine
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_v2_engine.py
      - name: Validate canonical RE-ENTRY V2 decision policy
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_v2_policy_validation.py
      - name: Refine V2 hidden-correction re-entry gate
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_v2_hidden_policy_refinement.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: reentry-v2-results
          path: artifacts/internal_correction_v2/**
          retention-days: 30
