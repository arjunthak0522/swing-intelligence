name: RE-ENTRY Unified Research

on:
  workflow_dispatch:
  push:
    branches: [internal-correction-v2]
    paths:
      - 'tools/internal_correction_v2.py'
      - 'tools/internal_correction_incremental_validation.py'
      - 'tools/internal_correction_subtype_decomposition.py'
      - 'tools/internal_correction_full_v2.py'
      - 'tools/reentry_engine.py'
      - 'tools/reentry_early_entry_policy.py'
      - 'tools/reentry_persistence_validation.py'
      - 'tools/reentry_final_policy_validation.py'
      - 'tools/reentry_subsector_intelligence.py'
      - 'tools/reentry_subsector_decision.py'
      - 'tools/reentry_subsector_validation.py'
      - 'tools/reentry_subsector_decision_validation.py'
      - 'tools/reentry_research_snapshot.py'
      - 'tools/reentry_recent_path_research.py'
      - 'tools/reentry_live_snapshot.py'
      - 'tests/test_reentry_engine_contract.py'
      - 'tests/test_reentry_early_entry_policy.py'
      - 'tests/test_reentry_subsector_intelligence.py'
      - 'tests/test_reentry_subsector_decision.py'
      - 'docs/internal-correction-v2-research-spec.md'
      - '.github/workflows/internal-correction-v2.yml'

permissions:
  contents: read

concurrency:
  group: reentry-unified-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance lxml pytest
      - name: Run broad and internal correction regression research
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/internal_correction_v2.py
      - name: Run incremental-value validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/internal_correction_incremental_validation.py
      - name: Run subtype diagnostics
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/internal_correction_subtype_decomposition.py
      - name: Run complete sector-factor state research
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/internal_correction_full_v2.py
      - name: Verify unified RE-ENTRY contracts
        run: pytest -q tests/test_reentry_engine_contract.py tests/test_reentry_early_entry_policy.py tests/test_reentry_subsector_intelligence.py tests/test_reentry_subsector_decision.py
      - name: Validate subsector hidden-damage and repair states
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_subsector_validation.py
      - name: Validate subsector DECISION contribution
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          REENTRY_RESEARCH_SUBSECTOR_CANDIDATE: '1'
        run: python tools/reentry_subsector_decision_validation.py
      - name: Validate entry-delay evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/internal_correction_v2/subsector_decision_validation.json')
          d = json.loads(p.read_text())
          timing = d.get('immediate_vs_wait', {})
          assert set(timing) == {'SPY', 'QQQ'}
          for symbol in ('SPY', 'QQQ'):
              for horizon in ('5', '7', '10', '15', '30', '60'):
                  row = timing[symbol][horizon]
                  assert 'immediate' in row
                  for delay in (1, 2, 3, 5):
                      assert f'wait_{delay}d' in row
          print('entry-delay evidence present for SPY/QQQ at 5/7/10/15/30/60D and waits 1/2/3/5')
          PY
      - name: Validate subsector robustness evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/internal_correction_v2/subsector_decision_validation.json')
          d = json.loads(p.read_text())
          assert set(d.get('era_split', {})) == {'2016_2020', '2021_present'}
          loo = d.get('leave_one_parent_sector_out', {})
          assert len(loo) == 11 and 'XLK' in loo
          assert 'neighbor_threshold_robustness' in d and d['neighbor_threshold_robustness']
          assert 'matched_controls' in d and d['matched_controls'].get('pairs', 0) > 0
          print('era, matched-control, leave-one-sector-out, XLK-out, and neighboring-definition robustness evidence present')
          PY
      - name: Build unified RE-ENTRY research snapshot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_research_snapshot.py
      - name: Diagnose recent unified decision path
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_recent_path_research.py
      - name: Validate persistence windows
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_persistence_validation.py
      - name: Validate exact final unified policy
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_final_policy_validation.py
      - name: Build same-day completed-close snapshot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_live_snapshot.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: reentry-unified-results
          path: |
            artifacts/internal_correction_v2/**
            artifacts/reentry/**
          retention-days: 30
