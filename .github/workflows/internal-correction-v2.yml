name: Internal Correction V2 Research

on:
  workflow_dispatch:
  push:
    branches: [internal-correction-v2]
    paths:
      - 'tools/internal_correction_v2.py'
      - 'docs/internal-correction-v2-research-spec.md'
      - '.github/workflows/internal-correction-v2.yml'

permissions:
  contents: read

concurrency:
  group: internal-correction-v2
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance lxml
      - name: Run frozen V2 research
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/internal_correction_v2.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: internal-correction-v2-results
          path: artifacts/internal_correction_v2/**
          retention-days: 30
