name: RE-ENTRY Freeze QA

on:
  workflow_dispatch:
  push:
    branches: [intraday-signal-research]
    paths:
      - 'tools/reentry_exhaustion_intraday.py'
      - 'tools/reentry_unified_engine.py'
      - 'tools/reentry_unified_snapshot_finalize.py'
      - 'tools/reentry_skew_intraday.py'
      - 'tools/reentry_nasi_bootstrap_diagnostic.py'
      - 'web/**'
      - 'tests/test_reentry_unified_engine.py'
      - 'tests/test_reentry_skew_same_session.py'
      - 'tests/test_reentry_unified_snapshot_quality.py'
      - 'tests/test_reentry_frontend_single_engine.py'
      - 'tests/test_reentry_stockcharts_provenance.py'
      - '.github/workflows/reentry-freeze-qa.yml'

permissions:
  contents: read

concurrency:
  group: reentry-freeze-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pandas numpy yfinance
      - name: Run unified-engine regression suite
        run: pytest -q tests/test_reentry_unified_engine.py tests/test_reentry_skew_same_session.py tests/test_reentry_unified_snapshot_quality.py tests/test_reentry_frontend_single_engine.py tests/test_reentry_stockcharts_provenance.py

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build unified dashboard locally in CI
        working-directory: web
        env:
          REENTRY_UNIFIED_SNAPSHOT_URL: https://raw.githubusercontent.com/arjunthak0522/swing-intelligence/intraday-signal-research/data/reentry/exhaustion_intraday_current.json
        run: npm run build
