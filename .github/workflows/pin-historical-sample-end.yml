name: Pin historical evidence sample end

on:
  push:
    branches: [product-clarity-historical-evidence-20260908]
    paths:
      - 'tools/pin_historical_sample_end.py'
      - '.github/workflows/pin-historical-sample-end.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/pin_historical_sample_end.py
      - name: Commit pinned sample end
        run: |
          if git diff --quiet -- tools/build_historical_episode_evidence.py; then exit 0; fi
          git config user.name "re-entry-evidence[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_historical_episode_evidence.py
          git commit -m "Pin historical evidence to canonical Sep 4 sample end [evidence-bot]"
          git push origin HEAD:${GITHUB_REF_NAME}
