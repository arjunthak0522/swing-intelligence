name: Run expanded shadow now

on:
  push:
    branches: [intraday-signal-research]
    paths:
      - '.github/workflows/run-expanded-shadow-now.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate expanded shadow from latest validated snapshot
        run: python tools/reentry_expanded_shadow.py
      - name: Persist expanded shadow
        run: |
          git config user.name 're-entry-research[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reentry/exhaustion_intraday_current.json data/reentry/expanded_shadow_history.csv
          git commit -m 'Record expanded early-go shadow state [skip ci]'
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research
