name: RSP Relative Strength Validation

on:
  workflow_dispatch:
  push:
    branches:
      - rsp-relative-strength-validation
    paths:
      - 'tools/rsp_relative_strength_validation.py'
      - 'tools/rsp_breadth_integration_validation.py'
      - '.github/workflows/rsp-relative-strength-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance lxml pytest
      - name: Run RSP incremental validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/rsp_relative_strength_validation.py
      - name: Run RSP breadth integration validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/rsp_breadth_integration_validation.py
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsp-relative-strength-validation
          path: |
            artifacts/rsp_relative_strength/
            artifacts/rsp_breadth_integration/
