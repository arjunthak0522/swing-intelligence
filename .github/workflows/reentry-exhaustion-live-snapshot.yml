name: RE-ENTRY Daily Context Capture

on:
  workflow_dispatch:
  push:
    branches: [intraday-signal-research]
    paths:
      - 'tools/reentry_exhaustion_live_snapshot.py'
      - 'tools/reentry_exhaustion_persist.py'
      - '.github/workflows/reentry-exhaustion-live-snapshot.yml'
  schedule:
    - cron: '10 21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: reentry-daily-context-capture
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture completed daily exhaustion context
        run: python tools/reentry_exhaustion_live_snapshot.py | tee reentry-exhaustion-live-snapshot.json
      - name: Persist daily context used by unified engine
        run: python tools/reentry_exhaustion_persist.py
      - name: Commit daily context only
        run: |
          if [ -z "$(git status --porcelain -- data/reentry/exhaustion_history.csv)" ]; then
            echo "No daily context change"
            exit 0
          fi
          git config user.name "re-entry-context[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reentry/exhaustion_history.csv
          git commit -m "Record RE-ENTRY daily context [skip ci]"
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research
      - uses: actions/upload-artifact@v4
        with:
          name: reentry-daily-context
          path: |
            reentry-exhaustion-live-snapshot.json
            data/reentry/exhaustion_history.csv
          retention-days: 30
