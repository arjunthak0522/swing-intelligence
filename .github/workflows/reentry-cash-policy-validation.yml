name: RE-ENTRY Cash Policy Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/reentry_cash_policy_validation.py'
      - 'tools/reentry_walkforward_validation.py'
      - 'tools/reentry_confidence.py'
      - 'tools/reentry_decision.py'
      - '.github/workflows/reentry-cash-policy-validation.yml'

concurrency:
  group: swing-intelligence-twelve-data
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run eight-state cash policy validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tools/reentry_cash_policy_validation.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reentry-cash-policy-validation
          path: artifacts/reentry_cash_policy_validation/**
          if-no-files-found: warn
          retention-days: 14
