name: RE-ENTRY Web Build

on:
  workflow_dispatch:
  push:
    branches: [internal-correction-v2]
    paths:
      - 'web/**'
      - '.github/workflows/reentry-web-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: web
        run: npm install
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build
