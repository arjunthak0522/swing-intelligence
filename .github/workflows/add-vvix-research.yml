name: Add VVIX research feed

on:
  push:
    branches: [intraday-signal-research]
    paths:
      - '.github/workflows/add-vvix-research.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
      - name: Add VVIX to intraday feed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/reentry_exhaustion_intraday.py')
          s = p.read_text()
          s = s.replace('    "$NAADV", "$NADEC",\n]', '    "$NAADV", "$NADEC", "$VVIX",\n]')
          s = s.replace('    naadv, nadec = qv("$NAADV"), qv("$NADEC")\n', '    naadv, nadec = qv("$NAADV"), qv("$NADEC")\n    vvix = qv("$VVIX")\n    vvix_prior_close = None\n    vvix_quote = quotes.get("$VVIX")\n    if vvix_quote and finite(vvix_quote.get("close_yesterday")):\n        vvix_prior_close = float(vvix_quote["close_yesterday"])\n    vvix_direction = "UNAVAILABLE"\n    if finite(vvix) and finite(vvix_prior_close):\n        vvix_delta = float(vvix) - float(vvix_prior_close)\n        vvix_direction = "RISING" if vvix_delta > 0.25 else "FALLING" if vvix_delta < -0.25 else "FLAT"\n')
          s = s.replace('        "NASI_DIRECTION": nasi.get("direction_vs_prior_close") if nasi else None,\n', '        "NASI_DIRECTION": nasi.get("direction_vs_prior_close") if nasi else None,\n        "VVIX": vvix,\n        "VVIX_PRIOR_CLOSE": vvix_prior_close,\n        "VVIX_DIRECTION": vvix_direction,\n')
          s = s.replace('"Intraday breadth from StockCharts delayed quote feed; NASI+ is calculated internally', '"Intraday breadth and VVIX from StockCharts delayed quote feed; NASI+ is calculated internally')
          p.write_text(s)
          PY
      - name: Commit VVIX feed
        run: |
          git config user.name 're-entry-research[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/reentry_exhaustion_intraday.py
          git commit -m 'Add live VVIX volatility-stress context [skip ci]'
          git push
