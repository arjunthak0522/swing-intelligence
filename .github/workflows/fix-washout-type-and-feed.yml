name: Fix unified feed type mismatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-washout-type-and-feed.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dashboard build
        working-directory: web
        run: |
          npm ci
          npm run build
      # production deploy trigger after successful unified feed source build
