name: Run unified RE-ENTRY final now

on:
  push:
    branches: [intraday-signal-research]
    paths:
      - '.github/workflows/run-unified-final-now.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intraday-signal-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas yfinance
      - name: Refresh breadth and fast families
        run: python tools/reentry_exhaustion_intraday.py
      - name: Refresh MMFD and VVIX
        run: python tools/reentry_mmfd_intraday.py
      - name: Refresh SPX skew
        run: python tools/reentry_skew_intraday.py
      - name: Run unified decision
        run: python tools/reentry_unified_engine.py
      - name: Persist result
        run: |
          git config user.name 're-entry-engine[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reentry/exhaustion_intraday_history.csv data/reentry/exhaustion_intraday_current.json data/reentry/skew_intraday_history.csv data/reentry/unified_engine_history.csv
          if git diff --cached --quiet; then
            echo 'No data changes'
            exit 0
          fi
          git commit -m 'Record unified RE-ENTRY final-close state [skip ci]'
          git pull --rebase origin intraday-signal-research
          git push origin HEAD:intraday-signal-research
      # final validation after preserving last valid live SKEW turn
